# Rebuilds shiurim.json, oraysa.json, vaad.json and sunday.json whenever an audio file is added, renamed or removed.
# Nothing to configure. Runs on GitHub's machines, free on public repos.

name: Update shiur list

on:
  push:
    branches: [main, master]
    paths:
      - 'audio/**'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-shiurim
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the shiur lists from the audio folder
        run: |
          python3 - <<'PY'
          import json, os, re

          AUDIO = 'audio'
          EXTS  = ('.mp3', '.m4a')

          def mb(filename):
              """Pull siman / seif katan out of MB-OC-###-###-###.mp3"""
              base = re.sub(r'\.[^.]+$', '', filename)
              for rx, keys in (
                  (r'MB-OC-(\d{3})-(\d{3})-to-(\d{3})-(\d{3})', ('siman','skFrom','simanTo','skTo')),
                  (r'MB-OC-(\d{3})-(\d{3})-(\d{3})',            ('siman','skFrom','skTo')),
                  (r'MB-OC-(\d{3})-(\d{3})',                    ('siman','skFrom')),
              ):
                  m = re.search(rx, base, re.I)
                  if m:
                      return dict(zip(keys, (int(g) for g in m.groups())))
              return None

          def dated(prefix):
              rx = re.compile(r'^' + prefix + r'-.*?(\d{4}-\d{2}-\d{2})', re.I)
              def parse(filename):
                  m = rx.search(re.sub(r'\.[^.]+$', '', filename))
                  return {'iso': m.group(1)} if m else None
              return parse

          def mb_order(path):
              d = mb(os.path.basename(path)) or {}
              return (d.get('siman', 10**6), d.get('skFrom', 10**6), path)

          def date_order(parse):
              return lambda path: ((parse(os.path.basename(path)) or {}).get('iso', '9999'), path)

          # manifest, filename parser, sort order, naming hint
          ORAYSA, VAAD, SUNDAY = dated('ORAYSA'), dated('VAAD'), dated('(?:FRIEDLANDER|FREIDLANDER)')
          LISTS = [
              ('shiurim.json', mb,     mb_order,           'MB-OC-###-###-###-...'),
              ('oraysa.json',  ORAYSA, date_order(ORAYSA), 'ORAYSA-Masechta-###a-YYYY-MM-DD'),
              ('vaad.json',    VAAD,   date_order(VAAD),   'VAAD-YYYY-MM-DD-Topic'),
              ('sunday.json',  SUNDAY, date_order(SUNDAY), 'FRIEDLANDER-YYYY-MM-DD-Topic'),
          ]

          found = []
          if os.path.isdir(AUDIO):
              found = [f'{AUDIO}/{n}' for n in sorted(os.listdir(AUDIO)) if n.lower().endswith(EXTS)]

          claimed = set()
          for manifest, parse, order, hint in LISTS:
              doc = {}
              if os.path.exists(manifest):
                  try:
                      with open(manifest, encoding='utf-8') as f:
                          doc = json.load(f)
                  except Exception as e:
                      print(f'::warning::{manifest} could not be read ({e}); rebuilding it.')
                      doc = {}

              # Remember hand-written entries so custom topics and dates survive
              kept = {}
              for e in doc.get('shiurim', []):
                  if isinstance(e, dict) and e.get('file'):
                      kept[e['file']] = e
                  elif isinstance(e, str):
                      kept[e] = None

              mine = sorted((p for p in found if parse(os.path.basename(p))), key=order)
              claimed.update(mine)
              doc['shiurim'] = [kept[p] if isinstance(kept.get(p), dict) else p for p in mine]

              for gone in (k for k in kept if k not in mine):
                  print(f'::notice::{gone} is no longer in the audio folder; removed from {manifest}.')

              new = json.dumps(doc, ensure_ascii=False, indent=2) + '\n'
              old = open(manifest, encoding='utf-8').read() if os.path.exists(manifest) else ''
              if new == old:
                  print(f'{manifest}: no change. {len(mine)} shiurim listed.')
              else:
                  with open(manifest, 'w', encoding='utf-8') as f:
                      f.write(new)
                  print(f'{manifest}: updated - {len(mine)} shiurim listed.')

          for path in found:
              if path not in claimed:
                  print(f'::warning::{path} does not match any naming pattern '
                        f'({", ".join(h for *_, h in LISTS)}) and will not appear on the site.')
          PY

      - name: Commit the updated list
        run: |
          if [ -z "$(git status --porcelain shiurim.json oraysa.json vaad.json sunday.json)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shiurim.json oraysa.json vaad.json sunday.json
          git commit -m "Update shiur list"
          git push
