<style>
/* =========================================================
   Limestone — stone and petrol teal, drawn from the shul logo
   ========================================================= */
:root{
  --bg:#EFF2F1; --surface:#FFFFFF; --sunk:#E4E9E8;
  --ink:#123C45; --ink-2:#5F7A85; --accent:#1F6E78; --accent-2:#2E8C93;
  --line:#D2DBDA; --onaccent:#FFFFFF;

  --display:"Frank Ruhl Libre",Georgia,serif;
  --body:"Spectral",Georgia,serif;
  --tick:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg); color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  min-height:100dvh;
  padding:2rem calc(1.25rem + env(safe-area-inset-right)) calc(2.5rem + env(safe-area-inset-bottom)) calc(1.25rem + env(safe-area-inset-left));
  display:flex; justify-content:center;
}
.wrap{width:100%;max-width:33rem;min-width:0}

/* ---------- masthead ---------- */
.masthead{text-align:center}
.logo{
  width:min(15rem,66%); height:auto; display:block; margin:0 auto;
  mix-blend-mode:multiply;
}
.series{
  font-family:var(--body); font-weight:600;
  font-size:.72rem; letter-spacing:.26em; text-transform:uppercase;
  color:var(--ink-2); margin-top:1.35rem;
}
.maggid{
  font-family:var(--display); font-weight:500;
  font-size:1.05rem; direction:rtl; color:var(--ink);
  margin-top:.5rem;
}

/* ---------- picker ---------- */
.picker{display:block;margin:1.6rem 0 0;position:relative}
.picker-label{
  font-family:var(--body); font-weight:600;
  font-size:.63rem; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-2); display:block; margin-bottom:.45rem;
}
select{
  -webkit-appearance:none;appearance:none; width:100%;
  background:var(--surface); color:var(--ink);
  font-family:var(--display); font-size:1rem; font-weight:500;
  border:1px solid var(--line); border-radius:3px;
  padding:.9rem 2.6rem .9rem 1rem; cursor:pointer;
}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chev{position:absolute;right:1rem;bottom:1.05rem;pointer-events:none;color:var(--accent);font-size:.65rem}

/* ---------- the arch: echoes the shul facade ---------- */
.plate{margin-top:2.2rem;text-align:center}
.aron{
  --w:clamp(12.5rem,58vw,14.5rem);
  width:var(--w); margin:0 auto;
  border:1.5px solid var(--accent);
  border-radius:calc(var(--w)/2) calc(var(--w)/2) 3px 3px;
  background:var(--surface);
  padding:calc(var(--w)*.30) 1rem 1.5rem;
}
.arch-label{
  font-family:var(--display); font-size:.85rem; font-weight:500;
  letter-spacing:.32em; color:var(--ink-2); direction:rtl;
}
.numeral{
  font-family:var(--display); font-weight:900;
  font-size:clamp(3.1rem,14vw,4.1rem); line-height:1.05;
  direction:rtl; color:var(--accent); margin-top:.1rem;
}
.skline{
  font-family:var(--display); font-weight:700;
  font-size:clamp(1.15rem,5.2vw,1.45rem); line-height:1.35;
  direction:rtl; color:var(--ink); margin-top:.5rem;
  padding-top:.5rem; border-top:1px solid var(--line);
}
.topic{
  font-family:var(--body); font-weight:400;
  font-size:1.16rem; line-height:1.5;
  margin:1.4rem auto 0; max-width:25rem;
  overflow-wrap:break-word;
}
.meta{
  font-family:var(--body); font-size:.78rem; color:var(--ink-2);
  margin-top:.7rem; line-height:1.7;
}

/* ---------- player ---------- */
.player{margin-top:1.9rem}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--sunk);border-radius:3px}
input[type=range]::-moz-range-track{height:3px;background:var(--sunk);border-radius:3px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--accent);margin-top:-5px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)
}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--accent)}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:6px;border-radius:3px}

.times{display:flex;justify-content:space-between;font-family:var(--tick);font-size:.68rem;color:var(--ink-2);margin-top:.1rem}
.controls{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-top:1.2rem}

button{background:none;border:0;color:var(--ink);font-family:var(--body);font-size:.74rem;cursor:pointer;padding:.5rem;border-radius:3px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button:disabled{opacity:.32;cursor:default}
.skip{
  font-family:var(--tick);font-size:.7rem;color:var(--ink-2);
  min-width:44px;min-height:44px;display:inline-flex;
  align-items:center;justify-content:center
}
.skip:hover:not(:disabled){color:var(--ink)}
.play{
  width:62px;height:62px;border-radius:50%;
  background:var(--accent);color:var(--onaccent);
  display:grid;place-items:center;font-size:1.1rem;padding:0;flex:0 0 auto;
  transition:transform .16s ease,background .16s ease
}
.play:hover:not(:disabled){transform:scale(1.05);background:var(--accent-2)}

.subrow{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:.15rem .5rem;
  margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)
}
.subrow button,.subrow a{
  font-family:var(--body);font-weight:600;font-size:.66rem;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);
  text-decoration:none;border-radius:3px;
  min-height:44px;display:inline-flex;align-items:center;padding:0 .3rem
}
.subrow button:hover:not(:disabled),.subrow a:hover{color:var(--accent)}
.subrow a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#speed{color:var(--accent);min-width:3.2rem}

.note{margin-top:1rem;font-size:.76rem;color:var(--accent);text-align:center;line-height:1.6;overflow-wrap:anywhere}

/* ---------- small phones ---------- */
@media (max-width:420px){
  body{padding-top:1.4rem}
  .logo{width:76%}
  .series{font-size:.66rem;letter-spacing:.2em;margin-top:1.1rem}
  .topic{font-size:1.08rem}
  .controls{gap:1.1rem}
  .subrow{justify-content:center;gap:0 .9rem}
  .subrow button,.subrow a{font-size:.62rem;letter-spacing:.08em}
  #speed{order:3}
  #dl{order:4}
}
@media (max-width:340px){
  .subrow button,.subrow a{font-size:.58rem;letter-spacing:.05em}
}

@media (prefers-reduced-motion:no-preference){
  .fade{animation:rise .42s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
</style>
</head>

<script>
/* ---- Hebrew numerals: 3 -> ג׳ , 241 -> רמ״א , 15 -> ט״ו ---- */
function gematria(n){
  const ones=['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
  const tens=['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
  const huns=['','ק','ר','ש','ת','תק','תר','תש','תת','תתק'];
  let s=huns[Math.floor(n/100)]||'';
  const r=n%100;
  if(r===15)s+='טו'; else if(r===16)s+='טז';
  else s+=tens[Math.floor(r/10)]+ones[r%10];
  return s.length===1 ? s+'\u05F3' : s.slice(0,-1)+'\u05F4'+s.slice(-1);
}

const SIMAN='\u05E1\u05D9\u05DE\u05DF', SK='\u05E1\u05F4\u05E7';
const NDASH='\u2013', LRM='\u200E';
const crosses=s=>s.simanTo!=null && s.simanTo!==s.siman;

/* just the letters — the word סימן is set in the arch above */
const simanNum=s=>crosses(s)
  ? `${gematria(s.siman)}${NDASH}${gematria(s.simanTo)}`
  : gematria(s.siman);

function skHe(s){
  if(s.skFrom==null) return '';
  if(crosses(s)) return `${SIMAN} ${gematria(s.siman)} ${SK} ${gematria(s.skFrom)}\n${NDASH}\n${SIMAN} ${gematria(s.simanTo)} ${SK} ${gematria(s.skTo)}`;
  if(s.skTo==null||s.skTo===s.skFrom) return `${SIMAN} ${gematria(s.siman)} ${SK} ${gematria(s.skFrom)}`;
  return `${SIMAN} ${gematria(s.siman)} ${SK} ${gematria(s.skFrom)}${NDASH}${gematria(s.skTo)}`;
}

/* For dropdown: single line, full siman-sk pairs */
function skHeDropdown(s){
  if(s.skFrom==null) return '';
  if(crosses(s)) return `${SIMAN} ${gematria(s.siman)} ${SK} ${gematria(s.skFrom)} ${NDASH} ${SIMAN} ${gematria(s.simanTo)} ${SK} ${gematria(s.skTo)}`;
  if(s.skTo==null||s.skTo===s.skFrom) return `${SIMAN} ${gematria(s.siman)} ${SK} ${gematria(s.skFrom)}`;
  return `${SIMAN} ${gematria(s.siman)} ${SK} ${gematria(s.skFrom)}${NDASH}${gematria(s.skTo)}`;
}
function skEn(s){
  if(s.skFrom==null) return 'Siman '+s.siman;
  if(crosses(s)) return `Siman ${s.siman} s"k ${s.skFrom} \u2014 Siman ${s.simanTo} s"k ${s.skTo}`;
  if(s.skTo==null||s.skTo===s.skFrom) return `Siman ${s.siman}, s"k ${s.skFrom}`;
  return `Siman ${s.siman}, s"k ${s.skFrom}-${s.skTo}`;
}

/* ---- read siman, seif katan and topic out of the filename ----
   MB-OC-429-001-004.mp3                        siman 429, s"k 1-4
   MB-OC-429-001-004-Shoalin-vDorshin.mp3       ...plus the topic
   MB-OC-429-014-to-430-003-Bedikas-Chametz.mp3 crosses into 430
   MB-OC-430-007.mp3                            siman 430, s"k 7 only

   Whatever follows the numbers becomes the topic: hyphens turn into
   spaces. A "topic" written in shiurim.json overrides it.            */
function parseFile(path){
  const name=(path||'').split('/').pop().replace(/\.[^.]+$/,'');
  let m,out;
  if((m=name.match(/MB-OC-(\d{3})-(\d{3})-to-(\d{3})-(\d{3})/i)))
    out={siman:+m[1],skFrom:+m[2],simanTo:+m[3],skTo:+m[4]};
  else if((m=name.match(/MB-OC-(\d{3})-(\d{3})-(\d{3})/i)))
    out={siman:+m[1],skFrom:+m[2],skTo:+m[3]};
  else if((m=name.match(/MB-OC-(\d{3})-(\d{3})/i)))
    out={siman:+m[1],skFrom:+m[2]};
  else return null;

  const rest=name.slice(m.index+m[0].length)
                 .replace(/^[-_\s]+/,'')
                 .replace(/[-_]+/g,' ')
                 .trim();
  if(rest) out.topic=rest;
  return out;
}

/* an entry may be a bare filename string, or an object with extras */
function normalize(entry){
  const o = (typeof entry==='string') ? {file:entry} : Object.assign({},entry);
  const p = parseFile(o.file);
  if(p) for(const k in p) if(o[k]==null) o[k]=p[k];
  return o;
}

/* ---- the six chalakim of Mishnah Berurah, by siman ---- */
const CHALAKIM=[
  [1,127,'Chelek 1'],[128,241,'Chelek 2'],[242,344,'Chelek 3'],

];
const chelekOf=n=>{
  const c=CHALAKIM.find(c=>n>=c[0]&&n<=c[1]);
  return c ? `${c[2]}  \u00B7  ${c[0]}\u2013${c[1]}` : 'Other';
};

let list=[], i=-1, sp=0, dragging=false, demo=false;

const mmss=t=>(!isFinite(t)||t<0)?'--:--':Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const nice=d=>{const x=new Date(d+'T12:00:00');return isNaN(x)?'':x.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});};

async function boot(){
  try{
    const r=await fetch('shiurim.json',{cache:'no-store'});
    if(!r.ok) throw 0;
    list=(await r.json()).shiurim||[];
  }catch(e){ list=FALLBACK; demo=true; }

  list=list.map(normalize);
  const bad=list.filter(s=>s.siman==null).map(s=>s.file);
  list=list.filter(s=>s.siman!=null);
  if(bad.length) console.warn('Skipped — filename does not match MB-OC-###-###-###:\n'+bad.join('\n'));

  if(!list.length){ $('pick').innerHTML='<option>No shiurim posted yet</option>'; return; }
  list.sort((a,b)=>(a.siman-b.siman)||((a.skFrom||0)-(b.skFrom||0)));

  const sel=$('pick');
  sel.innerHTML='<option value="" selected>Select a shiur\u2026</option>';
  let group=null,og=null;
  list.forEach((s,n)=>{
    const g=chelekOf(s.siman);
    if(g!==group){ group=g; og=document.createElement('optgroup'); og.label=g; sel.append(og); }
    const o=document.createElement('option');
    o.value=n;
    o.textContent=`${skHeDropdown(s)}${LRM}  \u00B7  ${s.topic||skEn(s)}`;
    og.append(o);
  });

  sel.addEventListener('change',()=>{ if(sel.value!=='') load(+sel.value,true); });
  const h=parseInt(location.hash.replace('#s',''),10);
  if(!isNaN(h)&&list[h]) load(h,false);
}

function load(n,autoplay){
  i=n; const s=list[i];
  $('plate').hidden=false;
  $('pick').value=String(i);
  history.replaceState(null,'','#s'+i);

  $('numeral').textContent=simanNum(s);
  $('skline').textContent=skHe(s);
  $('topic').textContent=s.topic||'';
  $('meta').innerHTML=[nice(s.date),skEn(s)].filter(Boolean).join('<br>');

  /* download as a readable filename, whatever the file is called in the repo */
  $('dl').href=s.file;
  $('dl').setAttribute('download',
    ('MB '+skEn(s)+(s.topic?' - '+s.topic:'')).replace(/["*/:<>?\\|]/g,'').slice(0,90)+'.mp3');

  ['numeral','skline','topic'].forEach(id=>{
    const el=$(id); el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade');
  });

  setMediaSession(s);

  $('note').hidden=!demo;
  if(demo) $('note').textContent='Preview mode \u2014 sample list shown. Once shiurim.json and the audio folder are live, the real recordings load here.';

  audio.src=s.file;
  audio.playbackRate=SPEEDS[sp];
  $('cur').textContent='0:00'; $('dur').textContent='--:--'; $('seek').value=0;
  $('prev').disabled=i===0; $('next').disabled=i===list.length-1;
  if(autoplay) audio.play().catch(()=>{});
  setIcon();
}

const setIcon=()=>{
  const p=!audio.paused;
  $('play').innerHTML=p?'&#10073;&#10073;':'&#9654;';
  $('play').setAttribute('aria-label',p?'Pause':'Play');
  if('mediaSession' in navigator) navigator.mediaSession.playbackState=p?'playing':'paused';
};

/* Lock screen, notification shade, car Bluetooth and headphone buttons */
function setMediaSession(s){
  if(!('mediaSession' in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({
    title:skEn(s),
    artist:s.topic||'\u05DE\u05D2\u05D9\u05D3 \u05E9\u05D9\u05E2\u05D5\u05E8: \u05E8\u05F3 \u05D3\u05D5\u05D3 \u05E7\u05DC\u05D9\u05D9\u05DF',
    album:'Dirshu Mishnah Berurah \u00B7 Khal Sunset Grove Sefard',
    artwork:[{src:'logo.png',sizes:'571x445',type:'image/png'}]
  });
  const act=(name,fn)=>{ try{navigator.mediaSession.setActionHandler(name,fn);}catch(e){} };
  act('play',()=>audio.play());
  act('pause',()=>audio.pause());
  act('seekbackward',()=>$('back').click());
  act('seekforward',()=>$('fwd').click());
  act('previoustrack',()=>{ if(i>0) load(i-1,true); });
  act('nexttrack',()=>{ if(i<list.length-1) load(i+1,true); });
  act('seekto',d=>{ if(d.seekTime!=null) audio.currentTime=d.seekTime; });
}

$('play').onclick=()=>{ audio.paused?audio.play().catch(()=>{}):audio.pause(); };
$('back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-15);
$('fwd').onclick=()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+15);
$('prev').onclick=()=>i>0&&load(i-1,!audio.paused);
$('next').onclick=()=>i<list.length-1&&load(i+1,!audio.paused);
$('speed').onclick=()=>{ sp=(sp+1)%SPEEDS.length; audio.playbackRate=SPEEDS[sp]; $('speed').innerHTML=SPEEDS[sp]+'&times;'; };

audio.addEventListener('play',setIcon);
audio.addEventListener('pause',setIcon);
audio.addEventListener('loadedmetadata',()=>$('dur').textContent=mmss(audio.duration));
audio.addEventListener('timeupdate',()=>{
  if(dragging||!audio.duration)return;
  $('seek').value=Math.round(audio.currentTime/audio.duration*1000);
  $('cur').textContent=mmss(audio.currentTime);
});
audio.addEventListener('ended',()=>{ if(i<list.length-1) load(i+1,true); });
audio.addEventListener('error',()=>{
  if(!audio.src)return;
  $('note').hidden=false;
  $('note').textContent='That recording could not be loaded. Check that '+((list[i]&&list[i].file)||'the file')+' is in the repo.';
});

const seek=$('seek');
seek.addEventListener('input',()=>{ dragging=true; if(audio.duration) $('cur').textContent=mmss(seek.value/1000*audio.duration); });
seek.addEventListener('change',()=>{ if(audio.duration) audio.currentTime=seek.value/1000*audio.duration; dragging=false; });

document.addEventListener('keydown',e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
  if(e.code==='Space'){e.preventDefault();$('play').click();}
  if(e.key==='ArrowLeft')$('back').click();
  if(e.key==='ArrowRight')$('fwd').click();
});

boot();
</script>
</body>
</html>
